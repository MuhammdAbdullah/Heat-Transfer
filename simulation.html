<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simulation Status</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="assets/android-chrome-512x512.png">
    <link rel="manifest" href="assets/site.webmanifest">
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .box {
            border: 1px solid #333;
            border-radius: 8px;
            padding: 16px;
            background: #1a1a1a;
            text-align: center;
        }
        .status {
            font-size: 20px;
            margin-bottom: 8px;
        }
        .details {
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 12px;
        }
        button {
            background: #ff7f50;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }
        button:hover {
            background: #ff6633;
        }
        #toggleVisualization {
            background: #4CAF50;
        }
        #toggleVisualization:hover {
            background: #45a049;
        }
        .viewer-container {
            border: 1px solid #333;
            border-radius: 8px;
            background: #050505;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        #viewer {
            width: 100%;
            height: 360px;
            border-radius: 6px;
            background: #000;
            position: relative;
            overflow: hidden;
        }
        #viewerStatus {
            font-size: 13px;
            color: #cccccc;
            text-align: center;
        }
        .legend {
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            background: #1a1a1a;
            font-size: 13px;
            color: #ddd;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .legend-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .legend-color {
            width: 60px;
            height: 12px;
            border-radius: 6px;
        }
        .legend-label {
            flex: 1;
            text-align: left;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="status">🔄 Simulation Running</div>
        <div class="details">
            The main window is generating test data for 30 seconds.<br>
            A 3D preview is shown below. <strong id="currentModel">Sample.step</strong>
        </div>
        <button id="toggleVisualization">Switch to Tunnel View</button>
        <button id="closeSimWindow">Close Window</button>
    </div>

    <div class="viewer-container">
        <div id="viewer"></div>
        <div id="viewerStatus">Loading Sample.step ...</div>
    </div>
    <div id="tempLegend" class="legend">Waiting for temperature data…</div>

    <script src="assets/libs/three.min.js"></script>
    <script src="assets/libs/OrbitControls.js"></script>
    <script src="assets/libs/occt-import-js.js"></script>
    <script src="assets/libs/GLTFLoader.js"></script>
    <script>
        (function () {
            var closeBtn = document.getElementById('closeSimWindow');
            if (closeBtn) {
                closeBtn.addEventListener('click', function () {
                    window.close();
                });
            }

            var viewer = document.getElementById('viewer');
            var viewerStatus = document.getElementById('viewerStatus');
            var tempLegend = document.getElementById('tempLegend');
            var lastAppliedTemps = null;
            var currentModelType = 'step'; // 'step' or 'glb'
            var toggleButton = document.getElementById('toggleVisualization');
            var currentModelLabel = document.getElementById('currentModel');

            if (!viewer) {
                return;
            }

            function getTemperaturesFromParent() {
                var defaults = [0, 0, 0, 0, 0, 0, 0, 0];
                try {
                    if (window.opener && window.opener.sharedTemperatures) {
                        return [
                            window.opener.sharedTemperatures.t1 || 0,
                            window.opener.sharedTemperatures.t2 || 0,
                            window.opener.sharedTemperatures.t3 || 0,
                            window.opener.sharedTemperatures.t4 || 0,
                            window.opener.sharedTemperatures.t5 || 0,
                            window.opener.sharedTemperatures.t6 || 0,
                            window.opener.sharedTemperatures.t7 || 0,
                            window.opener.sharedTemperatures.t8 || 0
                        ];
                    }
                } catch (error) {
                    console.warn('Unable to read temperatures from parent window:', error);
                }
                return defaults;
            }

            function temperatureToColor(temp) {
                var safeTemp = typeof temp === 'number' && isFinite(temp) ? temp : 0;
                var ratio = Math.max(0, Math.min(80, safeTemp)) / 80;
                var color = new THREE.Color();
                color.setRGB(ratio, 0, 1 - ratio);
                return color;
            }

            function updateLegend(temps) {
                if (!tempLegend) {
                    return;
                }
                var labels = ['T1 (0-3mm)', 'T2 (3-6mm)', 'T3 (6-9mm)', 'T4 (9-12mm)', 'T5 (12-15mm)', 'T6 (15-18mm)', 'T7 (18-21mm)', 'T8 (21-24mm)'];
                var htmlParts = [];
                for (var i = 0; i < 8; i++) {
                    var value = typeof temps[i] === 'number' && isFinite(temps[i]) ? temps[i] : 0;
                    var color = temperatureToColor(value);
                    var colorHex = '#' + color.getHexString();
                    htmlParts.push(
                        '<div class="legend-row">' +
                            '<span class="legend-label">' + labels[i] + ': ' + value.toFixed(1) + '°C</span>' +
                            '<div class="legend-color" style="background:' + colorHex + ';"></div>' +
                        '</div>'
                    );
                }
                htmlParts.push('<div style="font-size:12px;color:#999;">Bottom (T1) → Top (T8). 0°C = blue, 80°C = red.</div>');
                tempLegend.innerHTML = htmlParts.join('');
            }

            function tempsChanged(prev, next) {
                if (!prev || !next) {
                    return true;
                }
                for (var i = 0; i < 8; i++) {
                    var a = typeof prev[i] === 'number' ? prev[i] : 0;
                    var b = typeof next[i] === 'number' ? next[i] : 0;
                    if (Math.abs(a - b) > 0.05) {
                        return true;
                    }
                }
                return false;
            }

            function applyTemperatureColorsToGroup(group, temps) {
                if (!group || group.children.length === 0) {
                    return;
                }
                var boundingBox = new THREE.Box3().setFromObject(group);
                var minY = boundingBox.min.y;
                var height = Math.max(0.000001, boundingBox.max.y - boundingBox.min.y);
                group.traverse(function (child) {
                    if (!child.isMesh || !child.geometry) {
                        return;
                    }
                    var geometry = child.geometry;
                    if (geometry.index) {
                        geometry = geometry.toNonIndexed();
                        child.geometry = geometry;
                    }
                    var positionAttr = geometry.attributes.position;
                    if (!positionAttr) {
                        return;
                    }
                    var count = positionAttr.count;
                    var positions = positionAttr.array;
                    var colors = new Float32Array(count * 3);
                    for (var i = 0; i < count; i++) {
                        var y = positions[i * 3 + 1];
                        var normalized = (y - minY) / height;
                        // Clamp normalized value between 0 and 1
                        normalized = Math.max(0, Math.min(1, normalized));
                        
                        // Divide the 24mm height into 8 equal blocks of 3mm each
                        // Block 0: 0-3mm (T1, bottom)
                        // Block 1: 3-6mm (T2)
                        // Block 2: 6-9mm (T3)
                        // Block 3: 9-12mm (T4)
                        // Block 4: 12-15mm (T5)
                        // Block 5: 15-18mm (T6)
                        // Block 6: 18-21mm (T7)
                        // Block 7: 21-24mm (T8, top)
                        var blockIndex = Math.floor(normalized * 8);
                        // Clamp block index to valid range (0-7)
                        blockIndex = Math.min(7, Math.max(0, blockIndex));
                        
                        // Get temperature from the corresponding sensor
                        var tempValue = typeof temps[blockIndex] === 'number' && isFinite(temps[blockIndex]) ? temps[blockIndex] : 0;
                        
                        var color = temperatureToColor(tempValue);
                        colors[i * 3] = color.r;
                        colors[i * 3 + 1] = color.g;
                        colors[i * 3 + 2] = color.b;
                    }
                    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                    geometry.attributes.color.needsUpdate = true;
                    if (Array.isArray(child.material)) {
                        child.material.forEach(function (mat) {
                            if (mat) {
                                mat.vertexColors = true;
                                mat.needsUpdate = true;
                            }
                        });
                    } else if (child.material) {
                        child.material.vertexColors = true;
                        child.material.needsUpdate = true;
                    }
                });
            }

            // Basic Three.js setup
            var scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222222); // Dark gray background

            var width = viewer.clientWidth;
            var height = viewer.clientHeight;

            var camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 2000);
            // Initial position will be set by fitCameraToObject after model loads
            camera.position.set(0, 0, 500);

            var renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(window.devicePixelRatio || 1);
            viewer.appendChild(renderer.domElement);

            var ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            var directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            // Position light from front-top-right for good visibility
            directionalLight.position.set(100, 100, 200);
            scene.add(ambientLight);
            scene.add(directionalLight);

            var modelGroup = new THREE.Group();
            scene.add(modelGroup);

            var controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.rotateSpeed = 0.5;
            controls.zoomSpeed = 0.5;
            controls.panSpeed = 0.5;

            function buildMesh(geometryMesh) {
                var geometry = new THREE.BufferGeometry();
                geometry.setAttribute(
                    'position',
                    new THREE.Float32BufferAttribute(geometryMesh.attributes.position.array, 3)
                );

                if (geometryMesh.attributes.normal) {
                    geometry.setAttribute(
                        'normal',
                        new THREE.Float32BufferAttribute(geometryMesh.attributes.normal.array, 3)
                    );
                }

                var index = Uint32Array.from(geometryMesh.index.array);
                geometry.setIndex(new THREE.BufferAttribute(index, 1));

                var baseColor = geometryMesh.color
                    ? new THREE.Color(geometryMesh.color[0], geometryMesh.color[1], geometryMesh.color[2])
                    : new THREE.Color(0xcccccc);

                var materials = [
                    new THREE.MeshPhongMaterial({
                        color: baseColor,
                        specular: 0x222222,
                        shininess: 20,
                        vertexColors: true
                    })
                ];

                if (geometryMesh.brep_faces && geometryMesh.brep_faces.length > 0) {
                    for (var i = 0; i < geometryMesh.brep_faces.length; i++) {
                        var faceColor = geometryMesh.brep_faces[i].color;
                        var materialColor = faceColor
                            ? new THREE.Color(faceColor[0], faceColor[1], faceColor[2])
                            : baseColor;
                        materials.push(
                            new THREE.MeshPhongMaterial({
                                color: materialColor,
                                specular: 0x111111,
                                vertexColors: true
                            })
                        );
                    }

                    var triangleCount = geometryMesh.index.array.length / 3;
                    var triangleIndex = 0;
                    var faceColorGroupIndex = 0;

                    while (triangleIndex < triangleCount) {
                        var firstIndex = triangleIndex;
                        var lastIndex;
                        var materialIndex;

                        if (faceColorGroupIndex >= geometryMesh.brep_faces.length) {
                            lastIndex = triangleCount;
                            materialIndex = 0;
                        } else if (triangleIndex < geometryMesh.brep_faces[faceColorGroupIndex].first) {
                            lastIndex = geometryMesh.brep_faces[faceColorGroupIndex].first;
                            materialIndex = 0;
                        } else {
                            lastIndex = geometryMesh.brep_faces[faceColorGroupIndex].last + 1;
                            materialIndex = faceColorGroupIndex + 1;
                            faceColorGroupIndex++;
                        }

                        geometry.addGroup(firstIndex * 3, (lastIndex - firstIndex) * 3, materialIndex);
                        triangleIndex = lastIndex;
                    }
                }

                var mesh = new THREE.Mesh(geometry, materials.length > 1 ? materials : materials[0]);
                if (Array.isArray(mesh.material)) {
                    mesh.material.forEach(function (mat) {
                        if (mat) {
                            mat.vertexColors = true;
                        }
                    });
                } else if (mesh.material) {
                    mesh.material.vertexColors = true;
                }
                return mesh;
            }

            function fitCameraToObject(object) {
                var box = new THREE.Box3().setFromObject(object);
                var size = box.getSize(new THREE.Vector3());
                var center = box.getCenter(new THREE.Vector3());

                // For front view, position camera directly in front along Z-axis
                // Use the larger of width or height to ensure model fits
                var maxDim = Math.max(size.x, size.y);
                var fov = camera.fov * (Math.PI / 180);
                var cameraDistance = Math.abs(maxDim / (2 * Math.tan(fov / 2)));
                cameraDistance *= 1.5;

                // Position camera at center X and Y, but far back on Z-axis for front view
                camera.position.set(center.x, center.y, center.z + cameraDistance);
                camera.lookAt(center);
                controls.update();
            }

            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }

            animate();

            function loadStepModel() {
                viewerStatus.textContent = 'Loading Sample.step ...';
                var initialTemps = getTemperaturesFromParent();
                updateLegend(initialTemps);

                occtimportjs().then(function (occt) {
                    return fetch('assets/Sample.step').then(function (response) {
                        return response.arrayBuffer();
                    }).then(function (buffer) {
                        var fileBuffer = new Uint8Array(buffer);
                        var result = occt.ReadStepFile(fileBuffer, null);
                        if (!result || !result.meshes || result.meshes.length === 0) {
                            throw new Error('No meshes found in STEP file.');
                        }

                        result.meshes.forEach(function (meshData) {
                            var mesh = buildMesh(meshData);
                            modelGroup.add(mesh);
                        });

                        applyTemperatureColorsToGroup(modelGroup, initialTemps);
                        lastAppliedTemps = initialTemps.slice();
                        fitCameraToObject(modelGroup);
                        viewerStatus.textContent = 'Sample.step loaded. Colors show T1 (bottom) to T8 (top).';
                    });
                }).catch(function (error) {
                    console.error(error);
                    viewerStatus.textContent = 'Failed to load Sample.step. See console for details.';
                });
            }

            function loadGLBModel() {
                console.log('Starting to load Tunnel.glb...');
                viewerStatus.textContent = 'Loading Tunnel.glb ...';
                
                // Clear existing model
                while (modelGroup.children.length > 0) {
                    modelGroup.remove(modelGroup.children[0]);
                }
                
                // Check if GLTFLoader is available
                if (!THREE.GLTFLoader) {
                    console.error('GLTFLoader is not available!');
                    viewerStatus.textContent = 'Error: GLTFLoader not found';
                    return;
                }
                
                var loader = new THREE.GLTFLoader();
                console.log('GLTFLoader created, loading file...');
                
                loader.load(
                    'assets/Tunnel.glb',
                    function (gltf) {
                        // Successfully loaded
                        console.log('Tunnel.glb loaded successfully!', gltf);
                        console.log('Scene:', gltf.scene);
                        
                        if (gltf.scene) {
                            // Count meshes
                            var meshCount = 0;
                            gltf.scene.traverse(function(child) {
                                if (child.isMesh) {
                                    meshCount++;
                                    console.log('Found mesh:', child.name || 'unnamed', 'geometry:', child.geometry, 'material:', child.material);
                                }
                            });
                            console.log('Total meshes found:', meshCount);
                            
                            modelGroup.add(gltf.scene);
                            console.log('Added to scene, fitting camera...');
                            
                            // Calculate bounding box
                            var bbox = new THREE.Box3().setFromObject(modelGroup);
                            console.log('Model bounding box:', {
                                min: { x: bbox.min.x, y: bbox.min.y, z: bbox.min.z },
                                max: { x: bbox.max.x, y: bbox.max.y, z: bbox.max.z }
                            });
                            
                            var size = bbox.getSize(new THREE.Vector3());
                            console.log('Model size:', { x: size.x, y: size.y, z: size.z });
                            
                            fitCameraToObject(modelGroup);
                            
                            console.log('Camera position after fit:', { 
                                x: camera.position.x, 
                                y: camera.position.y, 
                                z: camera.position.z 
                            });
                            
                            viewerStatus.textContent = 'Tunnel.glb loaded successfully. Meshes: ' + meshCount;
                            currentModelLabel.textContent = 'Tunnel.glb';
                        } else {
                            console.error('No scene in GLTF object');
                            viewerStatus.textContent = 'Error: No scene in GLB file';
                        }
                    },
                    function (progress) {
                        // Loading progress
                        if (progress.total > 0) {
                            var percent = (progress.loaded / progress.total) * 100;
                            console.log('Loading progress: ' + percent + '%');
                            viewerStatus.textContent = 'Loading Tunnel.glb ... ' + Math.round(percent) + '%';
                        }
                    },
                    function (error) {
                        // Error loading
                        console.error('Error loading Tunnel.glb:', error);
                        console.error('Error details:', error.message || error);
                        viewerStatus.textContent = 'Failed to load Tunnel.glb: ' + (error.message || 'Unknown error');
                    }
                );
            }
            
            function toggleVisualization() {
                if (currentModelType === 'step') {
                    // Switch to GLB
                    currentModelType = 'glb';
                    loadGLBModel();
                    toggleButton.textContent = 'Switch to Sample View';
                } else {
                    // Switch to STEP
                    currentModelType = 'step';
                    loadStepModel();
                    toggleButton.textContent = 'Switch to Tunnel View';
                }
            }
            
            // Add toggle button click handler
            if (toggleButton) {
                toggleButton.addEventListener('click', toggleVisualization);
            }

            loadStepModel();
            setInterval(function () {
                if (modelGroup.children.length === 0) {
                    return;
                }
                // Only apply temperature colors to STEP model, not GLB
                if (currentModelType === 'step') {
                    var latestTemps = getTemperaturesFromParent();
                    if (!lastAppliedTemps || tempsChanged(lastAppliedTemps, latestTemps)) {
                        updateLegend(latestTemps);
                        applyTemperatureColorsToGroup(modelGroup, latestTemps);
                        lastAppliedTemps = latestTemps.slice();
                    }
                }
            }, 2000);

            window.addEventListener('resize', function () {
                var newWidth = viewer.clientWidth;
                var newHeight = viewer.clientHeight;
                camera.aspect = newWidth / newHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(newWidth, newHeight);
                controls.update();
            });
        })();
    </script>
    
    <!-- Load Responsive Scaling Script -->
    <script src="responsive-scaling.js"></script>
</body>
</html>
