<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self';">
    <title>Simulation Status</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="assets/android-chrome-512x512.png">
    <link rel="manifest" href="assets/site.webmanifest">
    
    <style>
        html {
            font-size: 16px; /* Base size - will be scaled automatically */
        }
        
        /* Minimal theme variables to match overall app */
        :root {
            --bg: #000000;
            --text: #ffffff;
            --panel: #333333;
            --border: #444444;
            --accent: #2ed573;
            --chart-bg: #1a1a1a;
            --chart-border: #444444;
            --chart-grid: #444444;
            --chart-text: #000000;
        }
        body.theme-dark {
            --bg: #000000;
            --text: #ffffff;
            --panel: #333333;
            --border: #444444;
            --accent: #2ed573;
            --chart-bg: #1a1a1a;
            --chart-border: #444444;
            --chart-grid: #444444;
            --chart-text: #eeeeee;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--bg, #000000);
            color: var(--text, #ffffff);
            margin: 0;
            padding: 1.25rem; /* Changed from 20px to rem */
            display: flex;
            flex-direction: column;
            gap: 1rem; /* Changed from 16px to rem */
            min-height: 100vh;
            font-size: 1rem; /* Use rem units instead of fixed pixels */
        }
        .box {
            border: 0.0625rem solid var(--border, #444); /* Changed from 1px to rem */
            border-radius: 0.5rem; /* Changed from 8px to rem */
            padding: 1rem; /* Changed from 16px to rem */
            background: var(--panel, #333);
            text-align: center;
            box-shadow: 0 0.5rem 2rem rgba(0, 0, 0, 0.3); /* Changed from 0 8px 32px to rem */
        }
        .status {
            font-size: 1.25rem; /* Changed from 20px to rem */
            margin-bottom: 0.5rem; /* Changed from 8px to rem */
            color: var(--text, #ffffff);
            font-weight: bold;
        }
        .details {
            font-size: 0.875rem; /* Changed from 14px to rem */
            line-height: 1.4;
            margin-bottom: 0.75rem; /* Changed from 12px to rem */
            color: var(--text, #ffffff);
            opacity: 0.9;
        }
        button {
            background: linear-gradient(135deg, #ff7f50 0%, #ff6633 100%);
            color: #fff;
            border: none;
            padding: 0.625rem 1.25rem; /* Changed from 10px 20px to rem */
            border-radius: 0.375rem; /* Changed from 6px to rem */
            cursor: pointer;
            font-size: 0.875rem; /* Changed from 14px to rem */
            margin: 0.3125rem; /* Changed from 5px to rem */
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 0.25rem 0.9375rem rgba(0, 0, 0, 0.2); /* Changed from 0 4px 15px to rem */
        }
        button:hover {
            background: linear-gradient(135deg, #ff6633 0%, #ff5500 100%);
            transform: translateY(-0.125rem); /* Changed from -2px to rem */
            box-shadow: 0 0.375rem 1.25rem rgba(255, 127, 80, 0.4); /* Changed from 0 4px 15px to rem */
        }
        #toggleVisualization {
            background: linear-gradient(135deg, #2ed573 0%, #1e90ff 100%);
        }
        #toggleVisualization:hover {
            background: linear-gradient(135deg, #1e90ff 0%, #2ed573 100%);
            box-shadow: 0 0.375rem 1.25rem rgba(46, 213, 115, 0.4); /* Changed from 0 4px 15px to rem */
        }
        .viewer-container {
            border: 0.0625rem solid var(--border, #444); /* Changed from 1px to rem */
            border-radius: 0.5rem; /* Changed from 8px to rem */
            background: var(--chart-bg, #1a1a1a);
            padding: 0.625rem; /* Changed from 10px to rem */
            display: flex;
            flex-direction: column;
            gap: 0.5rem; /* Changed from 8px to rem */
            box-shadow: 0 0.5rem 2rem rgba(0, 0, 0, 0.3); /* Changed from 0 8px 32px to rem */
        }
        #viewer {
            width: 100%;
            height: 22.5rem; /* Changed from 360px to rem */
            border-radius: 0.375rem; /* Changed from 6px to rem */
            background: var(--bg, #000);
            position: relative;
            overflow: hidden;
        }
        #viewerStatus {
            font-size: 0.8125rem; /* Changed from 13px to rem */
            color: var(--text, #ffffff);
            opacity: 0.8;
            text-align: center;
        }
        .legend {
            border: 0.0625rem solid var(--border, #444); /* Changed from 1px to rem */
            border-radius: 0.5rem; /* Changed from 8px to rem */
            padding: 0.625rem; /* Changed from 10px to rem */
            background: var(--panel, #333);
            font-size: 0.8125rem; /* Changed from 13px to rem */
            color: var(--text, #ffffff);
            display: flex;
            flex-direction: column;
            gap: 0.375rem; /* Changed from 6px to rem */
            box-shadow: 0 0.5rem 2rem rgba(0, 0, 0, 0.3); /* Changed from 0 8px 32px to rem */
        }
        .legend-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.625rem; /* Changed from 10px to rem */
        }
        .legend-color {
            width: 3.75rem; /* Changed from 60px to rem */
            height: 0.75rem; /* Changed from 12px to rem */
            border-radius: 0.375rem; /* Changed from 6px to rem */
        }
        .legend-label {
            flex: 1;
            text-align: left;
            color: var(--text, #ffffff);
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body class="theme-dark">
    <div class="box">
        <div class="status">🔄 Simulation Running</div>
        <div class="details">
            The main window is generating test data for 30 seconds.<br>
            A 3D preview is shown below. <strong id="currentModel">Sample.step</strong>
        </div>
        <div style="margin-top: 1rem;">
            <label for="modelSelect" style="color: var(--text, #ffffff); margin-right: 0.625rem; font-weight: bold;">Select 3D Model:</label>
            <select id="modelSelect" style="padding: 0.5rem 1rem; background: var(--panel, #333); color: var(--text, #ffffff); border: 0.0625rem solid var(--border, #444); border-radius: 0.375rem; font-size: 0.875rem; cursor: pointer;">
                <option value="Sample.step">Sample.step</option>
                <option value="Tunnel.glb">Tunnel.glb</option>
            </select>
        </div>
    </div>

    <div class="viewer-container">
        <div id="viewer"></div>
        <div id="viewerStatus">Loading Sample.step ...</div>
    </div>
    <div id="tempLegend" class="legend">Waiting for temperature data…</div>

    <script src="assets/libs/three.min.js"></script>
    <script src="assets/libs/OrbitControls.js"></script>
    <script src="assets/libs/occt-import-js.js"></script>
    <script src="assets/libs/GLTFLoader.js"></script>
    <script>
        (function () {
            var viewer = document.getElementById('viewer');
            var viewerStatus = document.getElementById('viewerStatus');
            var tempLegend = document.getElementById('tempLegend');
            var lastAppliedTemps = null;
            var currentModelType = 'step'; // 'step' or 'glb'
            var modelSelect = document.getElementById('modelSelect');
            var currentModelLabel = document.getElementById('currentModel');

            if (!viewer) {
                return;
            }

            function getTemperaturesFromParent() {
                var defaults = [0, 0, 0, 0, 0, 0, 0, 0];
                try {
                    if (window.opener && window.opener.sharedTemperatures) {
                        return [
                            window.opener.sharedTemperatures.t1 || 0,
                            window.opener.sharedTemperatures.t2 || 0,
                            window.opener.sharedTemperatures.t3 || 0,
                            window.opener.sharedTemperatures.t4 || 0,
                            window.opener.sharedTemperatures.t5 || 0,
                            window.opener.sharedTemperatures.t6 || 0,
                            window.opener.sharedTemperatures.t7 || 0,
                            window.opener.sharedTemperatures.t8 || 0
                        ];
                    }
                } catch (error) {
                    console.warn('Unable to read temperatures from parent window:', error);
                }
                return defaults;
            }

            function temperatureToColor(temp) {
                var safeTemp = typeof temp === 'number' && isFinite(temp) ? temp : 0;
                var ratio = Math.max(0, Math.min(80, safeTemp)) / 80;
                var color = new THREE.Color();
                color.setRGB(ratio, 0, 1 - ratio);
                return color;
            }

            function updateLegend(temps) {
                if (!tempLegend) {
                    return;
                }
                var labels = ['T1 (0-3mm)', 'T2 (3-6mm)', 'T3 (6-9mm)', 'T4 (9-12mm)', 'T5 (12-15mm)', 'T6 (15-18mm)', 'T7 (18-21mm)', 'T8 (21-24mm)'];
                var htmlParts = [];
                for (var i = 0; i < 8; i++) {
                    var value = typeof temps[i] === 'number' && isFinite(temps[i]) ? temps[i] : 0;
                    var color = temperatureToColor(value);
                    var colorHex = '#' + color.getHexString();
                    htmlParts.push(
                        '<div class="legend-row">' +
                            '<span class="legend-label">' + labels[i] + ': ' + value.toFixed(1) + '°C</span>' +
                            '<div class="legend-color" style="background:' + colorHex + ';"></div>' +
                        '</div>'
                    );
                }
                htmlParts.push('<div style="font-size:0.75rem;color:var(--text, #ffffff);opacity:0.7;">Bottom (T1) → Top (T8). 0°C = blue, 80°C = red.</div>');
                tempLegend.innerHTML = htmlParts.join('');
            }

            function tempsChanged(prev, next) {
                if (!prev || !next) {
                    return true;
                }
                for (var i = 0; i < 8; i++) {
                    var a = typeof prev[i] === 'number' ? prev[i] : 0;
                    var b = typeof next[i] === 'number' ? next[i] : 0;
                    if (Math.abs(a - b) > 0.05) {
                        return true;
                    }
                }
                return false;
            }

            function applyTemperatureColorsToGroup(group, temps) {
                if (!group || group.children.length === 0) {
                    return;
                }
                var boundingBox = new THREE.Box3().setFromObject(group);
                var minY = boundingBox.min.y;
                var maxY = boundingBox.max.y;
                var height = Math.max(0.000001, maxY - minY);
                
                // For the circular face coloring, check both X and Z axes to find the right one
                var minX = boundingBox.min.x;
                var maxX = boundingBox.max.x;
                var minZ = boundingBox.min.z;
                var maxZ = boundingBox.max.z;
                var lengthX = maxX - minX;
                var lengthZ = maxZ - minZ;
                
                // Use the axis with larger length (the cylinder's length direction)
                var useXAxis = lengthX > lengthZ;
                
                // Check where the sample is positioned
                var centerX = (minX + maxX) / 2;
                var centerZ = (minZ + maxZ) / 2;
                var centerY = (minY + maxY) / 2;
                
                console.log('=== Sample Position Analysis ===');
                console.log('Bounding box - X (Red):', minX.toFixed(2), 'to', maxX.toFixed(2), 'length:', lengthX.toFixed(2));
                console.log('Bounding box - Y (Green):', minY.toFixed(2), 'to', maxY.toFixed(2), 'length:', height.toFixed(2));
                console.log('Bounding box - Z (Blue):', minZ.toFixed(2), 'to', maxZ.toFixed(2), 'length:', lengthZ.toFixed(2));
                console.log('Center position - X:', centerX.toFixed(2), 'Y:', centerY.toFixed(2), 'Z:', centerZ.toFixed(2));
                console.log('Using', useXAxis ? 'X-axis (Red)' : 'Z-axis (Blue)', 'for circular face coloring');
                
                // Determine which end should be yellow based on position
                // If sample extends more on negative axis, color the negative end
                var colorNegativeEnd = false;
                if (useXAxis) {
                    if (Math.abs(minX) > Math.abs(maxX)) {
                        console.log('Sample extends more on negative X-axis - coloring negative X end (minX)');
                        colorNegativeEnd = true;
                    } else {
                        console.log('Sample extends more on positive X-axis - coloring positive X end (maxX)');
                        colorNegativeEnd = false;
                    }
                } else {
                    if (Math.abs(minZ) > Math.abs(maxZ)) {
                        console.log('Sample extends more on negative Z-axis - coloring negative Z end (minZ)');
                        colorNegativeEnd = true;
                    } else {
                        console.log('Sample extends more on positive Z-axis - coloring positive Z end (maxZ)');
                        colorNegativeEnd = false;
                    }
                }
                
                group.traverse(function (child) {
                    if (!child.isMesh || !child.geometry) {
                        return;
                    }
                    var geometry = child.geometry;
                    if (geometry.index) {
                        geometry = geometry.toNonIndexed();
                        child.geometry = geometry;
                    }
                    var positionAttr = geometry.attributes.position;
                    if (!positionAttr) {
                        return;
                    }
                    var count = positionAttr.count;
                    var positions = positionAttr.array;
                    var colors = new Float32Array(count * 3);
                    var blueCount = 0;
                    var yellowCount = 0;
                    var greenCount = 0;
                    var sampleDistances = [];
                    
                    // Calculate blue Z range once before the loop
                    // Blue for Z-axis from 0 to 1
                    var blueZMin = 0;
                    var blueZMax = 1;
                    
                    for (var i = 0; i < count; i++) {
                        var y = positions[i * 3 + 1];
                        var x = positions[i * 3];
                        var z = positions[i * 3 + 2];
                        var normalized = (y - minY) / height;
                        // Clamp normalized value between 0 and 1
                        normalized = Math.max(0, Math.min(1, normalized));
                        
                        // Check position for color assignment
                        // Green for X-axis: -1 to 1, Yellow for Y-axis: -1 to 1, Blue for Z-axis: 0 to 1
                        var useSpecialColor = false;
                        var specialColor = null;
                        var colorName = 'gray';
                        
                        // Check each axis independently - check Z-axis first for blue
                        if (z >= blueZMin && z <= blueZMax) {
                            // Blue for Z-axis in calculated range (check first)
                            useSpecialColor = true;
                            specialColor = new THREE.Color(0.0, 0.0, 1.0); // Pure blue
                            colorName = 'blue (Z-axis)';
                            blueCount++;
                        } else if (x >= -1 && x <= 1) {
                            // Green for X-axis between -1 and 1
                            useSpecialColor = true;
                            specialColor = new THREE.Color(0.0, 1.0, 0.0); // Pure green
                            colorName = 'green (X-axis)';
                            greenCount++;
                        } else if (y >= -1 && y <= 1) {
                            // Yellow for Y-axis between -1 and 1
                            useSpecialColor = true;
                            specialColor = new THREE.Color(1.0, 1.0, 0.0); // Pure yellow
                            colorName = 'yellow (Y-axis)';
                            yellowCount++;
                        }
                        
                        // Sample some positions for debugging
                        if (i < 10 || (useSpecialColor && i < 100)) {
                            sampleDistances.push({
                                x: x.toFixed(2),
                                y: y.toFixed(2),
                                z: z.toFixed(2),
                                useSpecialColor: useSpecialColor,
                                color: colorName
                            });
                        }
                        
                        var color;
                        if (useSpecialColor) {
                            // Use yellow (Z: 0-1) or green (Z: 5-10) based on Z-axis
                            color = specialColor;
                        } else {
                            // For vertices outside yellow/green ranges, use neutral gray color
                            // Don't show T1-T8 temperature colors
                            color = new THREE.Color(0.5, 0.5, 0.5); // Neutral gray
                        }
                        
                        colors[i * 3] = color.r;
                        colors[i * 3 + 1] = color.g;
                        colors[i * 3 + 2] = color.b;
                    }
                    console.log('=== Color Application Results ===');
                    console.log('Total vertices:', count);
                    console.log('Green vertices (X-axis: -1 to 1):', greenCount);
                    console.log('Yellow vertices (Y-axis: -1 to 1):', yellowCount);
                    console.log('Blue vertices (Z-axis: ' + blueZMin.toFixed(2) + ' to ' + blueZMax.toFixed(2) + '):', blueCount);
                    console.log('X-axis range - Min:', minX.toFixed(2), 'Max:', maxX.toFixed(2));
                    console.log('Y-axis range - Min:', minY.toFixed(2), 'Max:', maxY.toFixed(2));
                    console.log('Z-axis range - Min:', minZ.toFixed(2), 'Max:', maxZ.toFixed(2));
                    console.log('Sample positions:', sampleDistances.slice(0, 20));
                    
                    // Check if Z-axis range matches blue condition
                    if (blueCount === 0) {
                        console.warn('No blue vertices found! Z-axis range is:', minZ.toFixed(2), 'to', maxZ.toFixed(2));
                        console.warn('Looking for Z values between', blueZMin.toFixed(2), 'and', blueZMax.toFixed(2), 'but no vertices match.');
                        console.log('If you want blue to show, adjust the Z-axis range to match your model.');
                    }
                    
                    if (blueCount === 0 && yellowCount === 0 && greenCount === 0) {
                        console.warn('No special colors applied! Model may not be in the expected ranges.');
                        console.log('Check if model positions match: Green (X: -1 to 1), Yellow (Y: -1 to 1), Blue (Z: -10 to -1)');
                    }
                    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                    geometry.attributes.color.needsUpdate = true;
                    if (Array.isArray(child.material)) {
                        child.material.forEach(function (mat) {
                            if (mat) {
                                mat.vertexColors = true;
                                mat.needsUpdate = true;
                            }
                        });
                    } else if (child.material) {
                        child.material.vertexColors = true;
                        child.material.needsUpdate = true;
                    }
                });
            }

            // Basic Three.js setup
            var scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff); // White background to see dark models

            var width = viewer.clientWidth;
            var height = viewer.clientHeight;

            var camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 2000);
            // Initial position will be set by fitCameraToObject after model loads
            camera.position.set(0, 0, 500);

            var renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(window.devicePixelRatio || 1);
            viewer.appendChild(renderer.domElement);

            var ambientLight = new THREE.AmbientLight(0xffffff, 1.5); // Increased brightness
            var directionalLight = new THREE.DirectionalLight(0xffffff, 2.5); // Increased brightness
            // Position light from front-top-right for good visibility
            directionalLight.position.set(100, 100, 200);
            scene.add(ambientLight);
            scene.add(directionalLight);
            
            // Add additional lights for better visibility
            var directionalLight2 = new THREE.DirectionalLight(0xffffff, 1.3);
            directionalLight2.position.set(-100, 50, -100);
            scene.add(directionalLight2);
            
            var directionalLight3 = new THREE.DirectionalLight(0xffffff, 1.0);
            directionalLight3.position.set(0, -100, 0);
            scene.add(directionalLight3);

            var modelGroup = new THREE.Group();
            scene.add(modelGroup);
            
            // Add a grid helper to help see the scene
            var gridHelper = new THREE.GridHelper(100, 10, 0x444444, 0x222222);
            scene.add(gridHelper);
            
            // Add axes helper to see orientation
            var axesHelper = new THREE.AxesHelper(50);
            scene.add(axesHelper);

            var controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.rotateSpeed = 0.5;
            controls.zoomSpeed = 0.5;
            controls.panSpeed = 0.5;

            function buildMesh(geometryMesh) {
                // Check if we have valid position data
                if (!geometryMesh.attributes || !geometryMesh.attributes.position || !geometryMesh.attributes.position.array) {
                    console.warn('Mesh has no position data, skipping');
                    return null;
                }
                
                if (!geometryMesh.index || !geometryMesh.index.array) {
                    console.warn('Mesh has no index data, skipping');
                    return null;
                }
                
                var positionArray = geometryMesh.attributes.position.array;
                if (positionArray.length === 0) {
                    console.warn('Mesh has empty position array, skipping');
                    return null;
                }
                
                var geometry = new THREE.BufferGeometry();
                geometry.setAttribute(
                    'position',
                    new THREE.Float32BufferAttribute(positionArray, 3)
                );

                if (geometryMesh.attributes.normal && geometryMesh.attributes.normal.array) {
                    geometry.setAttribute(
                        'normal',
                        new THREE.Float32BufferAttribute(geometryMesh.attributes.normal.array, 3)
                    );
                }

                var index = Uint32Array.from(geometryMesh.index.array);
                if (index.length === 0) {
                    console.warn('Mesh has empty index array, skipping');
                    return null;
                }
                geometry.setIndex(new THREE.BufferAttribute(index, 1));

                var baseColor = geometryMesh.color
                    ? new THREE.Color(geometryMesh.color[0], geometryMesh.color[1], geometryMesh.color[2])
                    : new THREE.Color(0xcccccc);

                var materials = [
                    new THREE.MeshPhongMaterial({
                        color: baseColor,
                        specular: 0x222222,
                        shininess: 20,
                        vertexColors: true
                    })
                ];

                if (geometryMesh.brep_faces && geometryMesh.brep_faces.length > 0) {
                    for (var i = 0; i < geometryMesh.brep_faces.length; i++) {
                        var faceColor = geometryMesh.brep_faces[i].color;
                        var materialColor = faceColor
                            ? new THREE.Color(faceColor[0], faceColor[1], faceColor[2])
                            : baseColor;
                        materials.push(
                            new THREE.MeshPhongMaterial({
                                color: materialColor,
                                specular: 0x111111,
                                vertexColors: true
                            })
                        );
                    }

                    var triangleCount = geometryMesh.index.array.length / 3;
                    var triangleIndex = 0;
                    var faceColorGroupIndex = 0;

                    while (triangleIndex < triangleCount) {
                        var firstIndex = triangleIndex;
                        var lastIndex;
                        var materialIndex;

                        if (faceColorGroupIndex >= geometryMesh.brep_faces.length) {
                            lastIndex = triangleCount;
                            materialIndex = 0;
                        } else if (triangleIndex < geometryMesh.brep_faces[faceColorGroupIndex].first) {
                            lastIndex = geometryMesh.brep_faces[faceColorGroupIndex].first;
                            materialIndex = 0;
                        } else {
                            lastIndex = geometryMesh.brep_faces[faceColorGroupIndex].last + 1;
                            materialIndex = faceColorGroupIndex + 1;
                            faceColorGroupIndex++;
                        }

                        geometry.addGroup(firstIndex * 3, (lastIndex - firstIndex) * 3, materialIndex);
                        triangleIndex = lastIndex;
                    }
                }

                // Compute bounding box for the geometry
                geometry.computeBoundingBox();
                geometry.computeBoundingSphere();
                
                var mesh = new THREE.Mesh(geometry, materials.length > 1 ? materials : materials[0]);
                if (Array.isArray(mesh.material)) {
                    mesh.material.forEach(function (mat) {
                        if (mat) {
                            mat.vertexColors = true;
                        }
                    });
                } else if (mesh.material) {
                    mesh.material.vertexColors = true;
                }
                
                // Update the matrix to ensure the mesh is properly positioned
                mesh.updateMatrix();
                mesh.updateMatrixWorld(true);
                
                return mesh;
            }

            function fitCameraToObject(object) {
                var box = new THREE.Box3().setFromObject(object);
                var size = box.getSize(new THREE.Vector3());
                var center = box.getCenter(new THREE.Vector3());

                console.log('Fitting camera - Model size:', size.x, size.y, size.z);
                console.log('Fitting camera - Model center:', center.x, center.y, center.z);

                // Check if model has valid size
                if (size.x === 0 && size.y === 0 && size.z === 0) {
                    console.warn('Model has zero size, using default camera position');
                    camera.position.set(0, 0, 100);
                    camera.lookAt(0, 0, 0);
                    controls.target.set(0, 0, 0);
                    controls.update();
                    return;
                }

                // For front view, position camera directly in front along Z-axis
                // Use the larger of width, height, or depth to ensure model fits
                var maxDim = Math.max(size.x, size.y, size.z);
                
                // If maxDim is very small, use a minimum distance
                if (maxDim < 0.1) {
                    maxDim = 100;
                }
                
                var fov = camera.fov * (Math.PI / 180);
                var cameraDistance = Math.abs(maxDim / (2 * Math.tan(fov / 2)));
                cameraDistance *= 1.5;

                            depth = depth || 0;
                            var indent = '  '.repeat(depth);
                            console.log(indent + 'Type:', obj.type, 'Name:', obj.name || '(unnamed)');
                            console.log(indent + '  Position:', obj.position.x, obj.position.y, obj.position.z);
                            console.log(indent + '  Scale:', obj.scale.x, obj.scale.y, obj.scale.z);
                            console.log(indent + '  Visible:', obj.visible);
                            console.log(indent + '  Children:', obj.children ? obj.children.length : 0);
                            
                            if (obj.geometry) {
                                console.log(indent + '  HAS GEOMETRY!');
                                if (obj.geometry.attributes && obj.geometry.attributes.position) {
                                    console.log(indent + '    Vertices:', obj.geometry.attributes.position.count);
                                }
                            }
                            
                            if (obj.children && obj.children.length > 0) {
                                for (var i = 0; i < obj.children.length; i++) {
                                    logSceneStructure(obj.children[i], depth + 1);
                                }
                            }
                        }
                        
                        logSceneStructure(model, 0);
                        console.log('=== END SCENE STRUCTURE ===');
                        
                        // Add the model regardless of mesh count - sometimes geometry exists but isn't detected
                        // The model will be added below, so we don't need a test cube
                        
                        // Make all objects visible and ensure materials are visible
                        // Don't override colors - let the model use its original materials
                        // BUT: Skip this for manually created meshes - they handle their own materials
                        var hasManualMesh = false;
                        modelGroup.traverse(function(child) {
                            if (child.name && child.name.startsWith('ManuallyCreatedMesh_')) {
                                hasManualMesh = true;
                            }
                        });
                        
                        if (!hasManualMesh) {
                            // Only process original model materials if we didn't manually create meshes
                            model.traverse(function(child) {
                                child.visible = true;
                                if (child.material) {
                                    if (Array.isArray(child.material)) {
                                        child.material.forEach(function(mat) {
                                            if (mat) {
                                                mat.visible = true;
                                                // Don't force opacity - let materials be as they are
                                            }
                                        });
                                    } else {
                                        child.material.visible = true;
                                    }
                                }
                                child.updateMatrix();
                                child.updateMatrixWorld(true);
                            });
                        }
                        
                        // Increase lighting to make dark models more visible
                        ambientLight.intensity = 1.8; // Increased brightness
                        directionalLight.intensity = 3.0; // Increased brightness
                        
                        // Update additional lights if they exist
                        scene.traverse(function(obj) {
                            if (obj.isDirectionalLight && obj !== directionalLight) {
                                obj.intensity = Math.max(obj.intensity, 1.3);
                            }
                        });
                        
                        modelGroup.add(model);
                        modelGroup.updateMatrixWorld(true);
                        
                        // Check bounding box BEFORE rendering - if it has size, geometry exists!
                        var preRenderBox = new THREE.Box3().setFromObject(modelGroup);
                        var preRenderSize = preRenderBox.getSize(new THREE.Vector3());
                        var preRenderCenter = preRenderBox.getCenter(new THREE.Vector3());
                        console.log('Bounding box BEFORE render - Size:', preRenderSize.x, preRenderSize.y, preRenderSize.z);
                        console.log('Bounding box BEFORE render - Center:', preRenderCenter.x, preRenderCenter.y, preRenderCenter.z);
                        
                        // If we have a bounding box but no detected meshes, geometry exists but isn't being detected
                        // Force all objects to be visible and renderable
                        if (preRenderSize.x > 0 || preRenderSize.y > 0 || preRenderSize.z > 0) {
                            console.log('Geometry EXISTS (bounding box found)! Forcing visibility...');
                            modelGroup.traverse(function(obj) {
                                obj.visible = true;
                                obj.renderOrder = 0;
                                if (obj.material) {
                                    if (Array.isArray(obj.material)) {
                                        obj.material.forEach(function(mat) {
                                            if (mat) {
                                                mat.visible = true;
                                                mat.transparent = false;
                                            }
                                        });
                                    } else {
                                        obj.material.visible = true;
                                        obj.material.transparent = false;
                                    }
                                }
                            });
                        }
                        
                        // Force render first to initialize geometry
                        renderer.render(scene, camera);
                        
                        // Wait a moment for geometry to initialize, then try to fit camera
                        // BUT: Skip this if we manually created meshes (they handle their own camera positioning)
                        setTimeout(function() {
                            // Check if we manually created meshes - if so, skip automatic camera positioning
                            var hasManualMesh = false;
                            modelGroup.traverse(function(child) {
                                if (child.name && child.name.startsWith('ManuallyCreatedMesh_')) {
                                    hasManualMesh = true;
                                }
                            });
                            
                            if (hasManualMesh) {
                                console.log('Skipping automatic camera positioning - manual mesh handles it');
                                return; // Don't override manual camera positioning
                            }
                            
                            // Try multiple methods to find model bounds
                            var box = new THREE.Box3().setFromObject(modelGroup);
                            var size = box.getSize(new THREE.Vector3());
                            var center = box.getCenter(new THREE.Vector3());
                            
                            // If bounding box is zero, try computing from all children
                            if (size.x === 0 && size.y === 0 && size.z === 0) {
                                var min = new THREE.Vector3(Infinity, Infinity, Infinity);
                                var max = new THREE.Vector3(-Infinity, -Infinity, -Infinity);
                                var foundAny = false;
                                
                                modelGroup.traverse(function(child) {
                                    // Check for any object with position data
                                    if (child.position) {
                                        var worldPos = new THREE.Vector3();
                                        child.getWorldPosition(worldPos);
                                        min.x = Math.min(min.x, worldPos.x - 50);
                                        min.y = Math.min(min.y, worldPos.y - 50);
                                        min.z = Math.min(min.z, worldPos.z - 50);
                                        max.x = Math.max(max.x, worldPos.x + 50);
                                        max.y = Math.max(max.y, worldPos.y + 50);
                                        max.z = Math.max(max.z, worldPos.z + 50);
                                        foundAny = true;
                                    }
                                    
                                    // Also check geometry if it exists
                                    if (child.geometry && child.geometry.attributes && child.geometry.attributes.position) {
                                            var positions = child.geometry.attributes.position.array;
                                        var worldMatrix = new THREE.Matrix4();
                                        child.updateMatrixWorld(true);
                                        worldMatrix.copy(child.matrixWorld);
                                        
                                            for (var i = 0; i < positions.length; i += 3) {
                                            var localPos = new THREE.Vector3(positions[i], positions[i + 1], positions[i + 2]);
                                            var worldPos = localPos.applyMatrix4(worldMatrix);
                                            min.x = Math.min(min.x, worldPos.x);
                                            min.y = Math.min(min.y, worldPos.y);
                                            min.z = Math.min(min.z, worldPos.z);
                                            max.x = Math.max(max.x, worldPos.x);
                                            max.y = Math.max(max.y, worldPos.y);
                                            max.z = Math.max(max.z, worldPos.z);
                                            foundAny = true;
                                        }
                                    }
                                });
                                
                                if (foundAny) {
                                    size = new THREE.Vector3();
                                    size.subVectors(max, min);
                                    center = new THREE.Vector3();
                                    center.addVectors(min, max).multiplyScalar(0.5);
                                    box.setFromPoints([min, max]);
                                }
                            }
                            
                            // Position camera
                            if (size.x > 0 || size.y > 0 || size.z > 0) {
                                var maxDim = Math.max(size.x, size.y, size.z);
                                var fov = camera.fov * (Math.PI / 180);
                                var cameraDistance = Math.abs(maxDim / (2 * Math.tan(fov / 2))) * 1.5;
                                
                                // Ensure minimum distance
                                if (cameraDistance < 50) {
                                    cameraDistance = Math.max(maxDim * 2, 100);
                                }
                                
                                camera.position.set(center.x, center.y, center.z + cameraDistance);
                                camera.lookAt(center);
                                controls.target.copy(center);
                                controls.update();
                            } else {
                                // Fallback: try multiple positions to find the model
                                var positions = [
                                    [0, 0, 200],
                                    [100, 100, 200],
                                    [-100, 100, 200],
                                    [0, 100, 200],
                                    [0, 0, 500]
                                ];
                                
                                var currentPos = 0;
                                var tryNextPosition = function() {
                                    if (currentPos < positions.length) {
                                        var pos = positions[currentPos];
                                        camera.position.set(pos[0], pos[1], pos[2]);
                                        camera.lookAt(0, 0, 0);
                                        controls.target.set(0, 0, 0);
                            controls.update();
                            renderer.render(scene, camera);
                                        currentPos++;
                                        setTimeout(tryNextPosition, 300);
                                    }
                                };
                                
                                // Start with first position
                                camera.position.set(0, 0, 200);
                                camera.lookAt(0, 0, 0);
                                controls.target.set(0, 0, 0);
                                controls.update();
                            }
                            
                            // Final render
                            renderer.render(scene, camera);
                            viewerStatus.textContent = 'Tunnel.glb loaded! Use mouse to rotate/zoom if not visible.';
                            if (currentModelLabel) {
                                currentModelLabel.textContent = 'Tunnel.glb';
                            }
                        }, 200);
                        
                        lastAppliedTemps = initialTemps.slice();
                    },
                    function(progress) {
                        if (progress.total > 0) {
                            var percent = (progress.loaded / progress.total * 100).toFixed(0);
                            viewerStatus.textContent = 'Loading Tunnel.glb ... ' + percent + '%';
                        }
                    },
                    function(error) {
                        // Restore console functions
                        console.error = originalError;
                        console.warn = originalWarn;
                        console.error('Error loading Tunnel.glb:', error);
                        viewerStatus.textContent = 'Failed to load Tunnel.glb: ' + (error.message || 'Unknown error');
                    }
                );
            }

            function loadModel() {
                var selectedFile = modelSelect.value;
                
                if (selectedFile === 'Sample.step') {
                    currentModelType = 'step';
                    loadStepModel();
                } else if (selectedFile === 'Tunnel.glb') {
                    currentModelType = 'glb';
                    loadGLBModel();
                }
            }
            
            // Add model select change handler
            if (modelSelect) {
                modelSelect.addEventListener('change', loadModel);
            }

            loadStepModel();
            setInterval(function () {
                if (modelGroup.children.length === 0) {
                    return;
                }
                // Only apply temperature colors to STEP models, not GLB files
                // GLB files have their own materials and textures
                if (currentModelType === 'step') {
                var latestTemps = getTemperaturesFromParent();
                if (!lastAppliedTemps || tempsChanged(lastAppliedTemps, latestTemps)) {
                    updateLegend(latestTemps);
                    applyTemperatureColorsToGroup(modelGroup, latestTemps);
                    lastAppliedTemps = latestTemps.slice();
                    }
                } else {
                    // For GLB files, just update the legend
                    var latestTemps = getTemperaturesFromParent();
                    updateLegend(latestTemps);
                }
            }, 2000);

            window.addEventListener('resize', function () {
                var newWidth = viewer.clientWidth;
                var newHeight = viewer.clientHeight;
                camera.aspect = newWidth / newHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(newWidth, newHeight);
                controls.update();
            });
        })();
    </script>
    
    <!-- Load Responsive Scaling Script -->
</body>
